# Sensorfw configuration for Xiaomi Redmi Note 10 Pro / Pro Max (sweet / sweetin)
# Hardware: STMicro LSM6DSO IMU (Accel + Gyro), Rohm BU27030 (ALS), Xiaomi Proximity

[accelerometer]
scale = 1.0
transformation_matrix = "1,0,0,0,1,0,0,0,1"
default_interval = 20000
intervals = 10000,20000,50000,100000

[gyroscope]
scale = 1.0
transformation_matrix = "1,0,0,0,1,0,0,0,1"
default_interval = 20000
intervals = 10000,20000,50000,100000

[als]
scale = 1.0
default_interval = 200000

[proximity]
threshold = 1.0
default_interval = 200000

[orientation]
# Drives Lomiri auto-rotation between Portrait, Landscape, and Inverted
method = "threshold"
portrait_threshold = 45
landscape_threshold = 45
auto_rotate = true
